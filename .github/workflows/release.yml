name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate version tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected_version="$(tr -d '[:space:]' < VERSION)"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use the vX.Y.Z format." >&2
            exit 1
          fi

          if [[ "$version" != "$expected_version" ]]; then
            echo "Tag version $version does not match VERSION ($expected_version)." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release archive
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./Scripts/package-release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Mac-Battery-Ledger-${{ steps.version.outputs.version }}.zip" \
            "dist/Mac-Battery-Ledger-${{ steps.version.outputs.version }}.zip.sha256" \
            --generate-notes \
            --title "Mac Battery Ledger ${{ steps.version.outputs.version }}" \
            --verify-tag
